name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: PostgreSQL pour les tests de la base (3 essais si le réseau du serveur est instable)
        run: |
          if ! ls /usr/lib/postgresql/*/bin/postgres >/dev/null 2>&1; then
            for i in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y postgresql && break
              echo "Essai $i échoué, nouvel essai dans 20 s"; sleep 20
            done
          fi
          ls -d /usr/lib/postgresql/*/bin
      - run: npm run test:db
      - name: Navigateur pour les tests (sans apt, les bibliothèques système sont déjà sur le serveur)
        run: |
          for i in 1 2 3; do
            npx playwright install chromium && break
            echo "Essai $i échoué, nouvel essai dans 20 s"; sleep 20
          done
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_DATA: ${{ vars.VITE_DATA }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
